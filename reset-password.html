<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password — GlowAI</title>
<link rel="icon" href="glow-favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pink:#d95d8a;--ink:#20191d;--muted:#786b72;--border:#eadde3;--good:#2e8b57;--bad:#a83258}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#fff4f8);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
main{width:min(92vw,430px);background:#fff;border:1px solid var(--border);border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(60,30,45,.08)}
.brand{text-align:center;font-weight:900;font-size:28px}.brand span{color:var(--pink)}h1{text-align:center;font-size:24px;margin:20px 0 8px}p{color:var(--muted);line-height:1.5;text-align:center}label{display:block;font-weight:700;font-size:14px;margin:18px 0 7px}input{width:100%;padding:14px 15px;border:1px solid var(--border);border-radius:12px;font-size:16px;outline:none}input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(217,93,138,.12)}button,.primary{width:100%;border:0;border-radius:12px;padding:14px 16px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:20px;text-align:center}button:disabled{opacity:.55;cursor:not-allowed}.status{min-height:22px;margin-top:14px;text-align:center;font-size:14px;line-height:1.45}.error{display:none;background:#fff1f4;border:1px solid #f2c5d2;color:var(--bad);padding:12px 14px;border-radius:12px;margin-top:16px;font-size:14px;line-height:1.45}.success{display:none;text-align:center}.success-icon{font-size:42px;color:var(--good)}.back{display:block;text-align:center;color:var(--pink);font-weight:700;text-decoration:none;margin-top:22px}
</style></head><body><main>
<div class="brand">Glow<span>AI</span></div>
<section id="resetUI"><h1>Choose a new password</h1><p>Enter a new password for your GlowAI account.</p>
<form id="form" novalidate><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
<button id="submit" type="submit">Update password</button></form>
<div id="error" class="error"></div><button id="retry" type="button" style="display:none;background:#fff;color:var(--ink);border:1px solid var(--border)">Try again</button><div id="status" class="status"></div></section>
<section id="success" class="success"><div class="success-icon">✓</div><div style="font-weight:800;color:var(--good);font-size:16px;margin-top:8px">Success!</div><h1>Password changed successfully!</h1><p>Your password was changed successfully. You will be redirected to GlowAI in 5 seconds.</p><a class="primary" href="/" style="display:block;text-decoration:none">Continue to GlowAI →</a></section>
<a class="back" href="/">← Back to GlowAI</a></main>
<script>
const SUPABASE_URL='https://zemtiarotfjfwkmoqziu.supabase.co';
const SUPABASE_KEY='sb_publishable_4_BMevbVVJcgAJFvTnwC7Q_ZoL8iAvv';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'pkce'}});
const $=id=>document.getElementById(id); let session=null, cooldown=null, busy=false;
function status(t,bad=false){$('status').textContent=t||'';$('status').style.color=bad?'var(--bad)':'var(--good)'}
function error(t,withRetry=true){$('error').textContent=t||'Something went wrong. Please try again.';$('error').style.display='block';$('retry').style.display=withRetry?'block':'none';}
function clearError(){ $('error').style.display='none';$('error').textContent='';$('retry').style.display='none'; }
function cooldown5(){clearInterval(cooldown);let n=5;$('submit').disabled=true;$('submit').textContent=`Try again in ${n}s`;cooldown=setInterval(()=>{n--;if(n<=0){clearInterval(cooldown);cooldown=null;$('submit').disabled=false;$('submit').textContent='Update password';status('You can try again now.');}else $('submit').textContent=`Try again in ${n}s`;},1000)}
function showSuccess(){busy=false;$('resetUI').style.display='none';$('success').style.display='block';setTimeout(()=>window.location.replace('/'),5000)}
async function establishRecoverySession(){
  const u=new URL(window.location.href);
  const code=u.searchParams.get('code');
  const hash=new URLSearchParams((u.hash||'').replace(/^#/,'').replace(/^\?/,'').replace(/&/g,'&'));
  const access=hash.get('access_token')||u.searchParams.get('access_token');
  const refresh=hash.get('refresh_token')||u.searchParams.get('refresh_token');
  const type=hash.get('type')||u.searchParams.get('type');
  if(code){
    const {data,error:exErr}=await sb.auth.exchangeCodeForSession(code);
    if(exErr) throw exErr;
    if(data.session){session=data.session;return session;}
  }
  if(access&&refresh){
    const {data,error:setErr}=await sb.auth.setSession({access_token:access,refresh_token:refresh});
    if(setErr) throw setErr;
    if(data.session){session=data.session;return session;}
  }
  const {data,error:getErr}=await sb.auth.getSession();
  if(getErr) throw getErr;
  if(data.session){session=data.session;return session;}
  if(type==='recovery'||code||access) throw new Error('We could not verify this password-reset link. Please request a new reset email.');
  throw new Error('Please open the password reset link from the email to continue.');
}
(async()=>{try{
  const u=new URL(location.href); const err=u.searchParams.get('error_description')||u.hash.match(/(?:^|&)error_description=([^&]*)/)?.[1]; if(err) throw new Error(decodeURIComponent(err.replace(/\+/g,' ')));
  session=await establishRecoverySession();
  // Remove one-time recovery code/tokens only after the session is established.
  if(u.search||u.hash){history.replaceState({},document.title,u.pathname);}
  status('Your reset link is ready. Enter your new password.'); $('password').focus();
}catch(e){console.error('Recovery setup failed',e);error(e.message||'This reset link is invalid or expired.',false);status('',true)}})();
$('retry').onclick=()=>{clearError();status('Checking your reset session…');establishRecoverySession().then(()=>status('Your reset session is ready. Try again.')).catch(e=>{error(e.message,true);status('',true)})};
$('form').onsubmit=async e=>{e.preventDefault();if(busy||$('submit').disabled)return;clearError();const p=$('password').value,c=$('confirm').value;if(p.length<8){error('Password must be at least 8 characters.');cooldown5();return}if(p!==c){error('Passwords do not match.');cooldown5();return}busy=true;$('submit').disabled=true;$('submit').textContent='Updating…';status('Updating your password…');try{
  if(!session) session=await establishRecoverySession();
  const r=await sb.auth.updateUser({password:p});
  if(r.error) throw r.error;
  const g=await sb.auth.getUser(); if(g.error||!g.data.user) throw (g.error||new Error('The password change could not be confirmed.'));
  showSuccess();
}catch(e){console.error('updateUser failed',e);busy=false;error(e.message||'Your password could not be changed. Please try again.');status('',true);cooldown5()}}
</script></body></html>
